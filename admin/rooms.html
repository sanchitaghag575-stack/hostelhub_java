<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms | HostelHub Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar" style="background:#07549b;">
        <div class="sidebar-brand">🏠 Admin Panel</div>
        <div class="sidebar-user" id="sidebarUser"></div>
        <nav>
            <a href="dashboard.html"     class="sidebar-link">📊 Dashboard</a>
            <a href="rooms.html"         class="sidebar-link">🛏 Rooms</a>
            <a href="residents.html"     class="sidebar-link">👥 Residents</a>
            <a href="allocations.html"   class="sidebar-link">📋 Allocations</a>
            <a href="payments.html"      class="sidebar-link">💳 Payments</a>
            <a href="complaints.html"    class="sidebar-link">🔧 Complaints</a>
            <a href="announcements.html" class="sidebar-link">📢 Announcements</a>
            <a href="hostels.html"       class="sidebar-link">🏠 My Hostels</a>
            <a href="booking.html"       class="sidebar-link">📋 Bookings</a>
            <button onclick="logoutUser()" class="sidebar-link sidebar-logout">🚪 Logout</button>
        </nav>
        <div style="padding:16px 20px;margin-top:auto;border-top:1px solid rgba(255,255,255,0.1);">
            <button onclick="resetDemoData()" style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.2);padding:7px 14px;border-radius:6px;font-size:0.78rem;cursor:pointer;width:100%;">🔄 Reset Demo Data</button>
        </div>
    </aside>

    <div class="dashboard-content">
        <div class="dashboard-topbar">
            <span class="topbar-title">Room Management</span>
            <span class="topbar-user" id="topbarUser"></span>
        </div>
        <main class="dashboard-main">
            <div id="messageContainer"></div>

            <!-- Add Room Form -->
            <div class="panel" style="margin-bottom:24px;">
                <div class="panel-header"><h2>➕ Add New Room</h2></div>
                <div class="panel-body">
                    <form id="addRoomForm">
                        <div class="add-room-form">
                            <div class="form-group-d">
                                <label>Room Number *</label>
                                <input type="text" id="newRoomNumber" placeholder="e.g. 401">
                            </div>
                            <div class="form-group-d">
                                <label>Floor *</label>
                                <select id="newFloor">
                                    <option value="">Select floor</option>
                                    <option value="1">1st Floor</option>
                                    <option value="2">2nd Floor</option>
                                    <option value="3">3rd Floor</option>
                                    <option value="4">4th Floor</option>
                                </select>
                            </div>
                            <div class="form-group-d">
                                <label>Type *</label>
                                <select id="newType">
                                    <option value="">Select type</option>
                                    <option value="Single">Single</option>
                                    <option value="Double">Double</option>
                                    <option value="Triple">Triple</option>
                                </select>
                            </div>
                            <div class="form-group-d">
                                <label>Capacity *</label>
                                <input type="number" id="newCapacity" placeholder="e.g. 2" min="1" max="6">
                            </div>
                            <div class="form-group-d">
                                <label>Rent / Month (₹) *</label>
                                <input type="number" id="newRent" placeholder="e.g. 6000" min="1000">
                            </div>
                        </div>
                        <div class="form-group-d" style="margin-top:12px;">
                            <label>Facilities</label>
                            <div class="checkbox-group">
                                <label class="checkbox-item"><input type="checkbox" class="facilityCheck" value="Wi-Fi"> Wi-Fi</label>
                                <label class="checkbox-item"><input type="checkbox" class="facilityCheck" value="Fan"> Fan</label>
                                <label class="checkbox-item"><input type="checkbox" class="facilityCheck" value="Attached Bathroom"> Attached Bathroom</label>
                                <label class="checkbox-item"><input type="checkbox" class="facilityCheck" value="Study Table"> Study Table</label>
                                <label class="checkbox-item"><input type="checkbox" class="facilityCheck" value="Wardrobe"> Wardrobe</label>
                                <label class="checkbox-item"><input type="checkbox" class="facilityCheck" value="Parking"> Parking</label>
                            </div>
                        </div>
                        <button type="submit" class="btn-dashboard btn-blue" style="margin-top:16px;padding:10px 28px;">Add Room</button>
                    </form>
                </div>
            </div>

            <!-- Rooms Table -->
            <div class="panel">
                <div class="panel-header">
                    <h2>All Rooms</h2>
                    <span id="roomCount" style="font-size:0.82rem;color:#667085;"></span>
                </div>
                <div class="panel-body" style="padding:0;overflow-x:auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Room</th><th>Floor</th><th>Type</th><th>Occupancy</th><th>Rent</th><th>Status</th><th>Facilities</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="roomsTableBody">
                            <tr><td colspan="8" style="text-align:center;padding:32px;color:#667085;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
