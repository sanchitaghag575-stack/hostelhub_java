<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints | HostelHub Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar" style="background:#07549b;">
        <div class="sidebar-brand">🏠 Admin Panel</div>
        <div class="sidebar-user" id="sidebarUser"></div>
        <nav>
            <a href="dashboard.html"     class="sidebar-link">📊 Dashboard</a>
            <a href="rooms.html"         class="sidebar-link">🛏 Rooms</a>
            <a href="residents.html"     class="sidebar-link">👥 Residents</a>
            <a href="allocations.html"   class="sidebar-link">📋 Allocations</a>
            <a href="payments.html"      class="sidebar-link">💳 Payments</a>
            <a href="complaints.html"    class="sidebar-link">🔧 Complaints</a>
            <a href="announcements.html" class="sidebar-link">📢 Announcements</a>
            <a href="hostels.html"       class="sidebar-link">🏠 My Hostels</a>
            <a href="booking.html"       class="sidebar-link">📋 Bookings</a>
            <button onclick="logoutUser()" class="sidebar-link sidebar-logout">🚪 Logout</button>
        </nav>
        <div style="padding:16px 20px;margin-top:auto;border-top:1px solid rgba(255,255,255,0.1);">
            <button onclick="resetDemoData()" style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.2);padding:7px 14px;border-radius:6px;font-size:0.78rem;cursor:pointer;width:100%;">🔄 Reset Demo Data</button>
        </div>
    </aside>
    <div class="dashboard-content">
        <div class="dashboard-topbar">
            <span class="topbar-title">Complaints Management</span>
            <span class="topbar-user" id="topbarUser"></span>
        </div>
        <main class="dashboard-main">
            <div id="messageContainer"></div>
            <div class="panel">
                <div class="panel-header">
                    <h2>All Complaints</h2>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span id="complaintCount" style="font-size:0.82rem;color:#667085;"></span>
                        <select id="complaintFilter" class="status-select" style="font-size:0.85rem;">
                            <option value="All">All Status</option>
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                </div>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead>
                            <tr><th>#</th><th>Student</th><th>Title</th><th>Category</th><th>Priority</th><th>Update Status</th><th>Submitted</th></tr>
                        </thead>
                        <tbody id="complaintsTableBody">
                            <tr><td colspan="7" style="text-align:center;padding:32px;color:#667085;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
