<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | HostelHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🏠 HostelHub
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="facilities.html">Facilities</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="applications.html">Applications</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>

        <div class="nav-buttons">

            <a href="login.html" class="btn btn-outline">
                Login
            </a>

            <a href="register.html" class="btn btn-primary">
                Register
            </a>

        </div>
        
    </header>

    <main class="application-container">

        <div class="application-header">

            <h1>Contact Us</h1>

            <p>
                Having doubts? Feel free to contact us.
            </p>

        </div>

        <div class="selected-room-card">

            <h2>HostelHub Support</h2>

            <p>
                📧 Email: support@hostelhub.com
            </p>

            <p>
                📞 Phone: +91 98765 43210
            </p>

            <p>
                📍 Address: HostelHub Campus, Mumbai, Maharashtra
            </p>

        </div>

        <form id="contactForm">

            <h2>Send Us a Message</h2>

            <div class="form-group">

                <label for="contactName">
                    Name
                </label>

                <input
                    type="text"
                    id="contactName"
                    required
                >

            </div>

            <div class="form-group">

                <label for="contactEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="contactEmail"
                    required
                >

            </div>

            <div class="form-group">

                <label for="contactMessage">
                    Message
                </label>

                <textarea
                    id="contactMessage"
                    rows="5"
                    required
                ></textarea>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="submit-application-btn"
                >
                    Send Message
                </button>

            </div>

        </form>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
