<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find PGs | HostelHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">
            🏠 HostelHub
        </div>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="rooms.html">
                Find PG
            </a>

            <a href="facilities.html">
                Facilities
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="applications.html">
                Applications
            </a>
            <a href="admin/hostels.html">Owner Portal</a>
            <a href="dashboard.html">
                Dashboard
            </a>

        </nav>


        <div class="nav-buttons" id="navButtons">

            <a
                href="login.html"
                class="btn btn-outline"
            >
                Login
            </a>

            <a
                href="register.html"
                class="btn btn-primary"
            >
                Register
            </a>

        </div>

    </header>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>

        <section class="rooms-page">


            <!-- =========================
                 PAGE HEADER
            ========================== -->

            <div class="rooms-page-header">

                <div>

                    <p class="section-tag">
                        FIND YOUR SPACE
                    </p>


                    <h1 id="resultsTitle">
                        PGs Near Your College
                    </h1>


                    <p id="resultsSubtitle">
                        Find affordable student accommodation
                        near your college.
                    </p>

                </div>


                <div class="room-count">

                    <strong id="availableRoomCount">
                        0
                    </strong>

                    <span>
                        PGs Found
                    </span>

                </div>

            </div>



            <!-- =========================
                 FILTERS
            ========================== -->

            <div class="room-filters">


                <!-- SEARCH -->

                <div class="filter-group search-filter">

                    <label for="roomSearch">
                        Search
                    </label>


                    <input
                        type="text"
                        id="roomSearch"
                        placeholder="Search by PG name or area..."
                    >

                </div>



                <!-- SHARING -->

                <div class="filter-group">

                    <label for="roomTypeFilter">
                        Sharing
                    </label>


                    <select id="roomTypeFilter">

                        <option value="all">
                            All Sharing Types
                        </option>

                        <option value="single">
                            Single Sharing
                        </option>

                        <option value="double">
                            Double Sharing
                        </option>

                        <option value="triple">
                            Triple Sharing
                        </option>

                        <option value="four">
                            4 Sharing
                        </option>

                    </select>

                </div>



                <!-- MAXIMUM RENT -->

                <div class="filter-group">

                    <label for="rentFilter">
                        Maximum Rent
                    </label>


                    <select id="rentFilter">

                        <option value="all">
                            Any Rent
                        </option>

                        <option value="5000">
                            Up to ₹5,000
                        </option>

                        <option value="6000">
                            Up to ₹6,000
                        </option>

                        <option value="7000">
                            Up to ₹7,000
                        </option>

                        <option value="8000">
                            Up to ₹8,000
                        </option>

                        <option value="10000">
                            Up to ₹10,000
                        </option>

                        <option value="15000">
                            Up to ₹15,000
                        </option>

                    </select>

                </div>



                <!-- SORT -->

                <div class="filter-group">

                    <label for="sortFilter">
                        Sort By
                    </label>


                    <select id="sortFilter">

                        <option value="default">
                            Recommended
                        </option>

                        <option value="price-low">
                            Price: Low to High
                        </option>

                        <option value="price-high">
                            Price: High to Low
                        </option>

                        <option value="distance">
                            Distance: Nearest First
                        </option>

                        <option value="rating">
                            Rating: Highest First
                        </option>

                    </select>

                </div>



                <!-- CLEAR -->

                <button
                    type="button"
                    class="clear-filter"
                    id="clearFiltersBtn"
                >
                    Clear Filters
                </button>

            </div>



            <!-- =========================
                 PG RESULTS
            ========================== -->

            <div
                class="rooms-grid"
                id="roomsGrid"
            >
            </div>



            <!-- =========================
                 NO RESULTS
            ========================== -->

            <div
                id="noRoomsMessage"
                class="no-rooms-message"
                style="display: none;"
            >

                <div class="no-rooms-icon">
                    🔍
                </div>


                <h3>
                    No PGs Found
                </h3>


                <p>
                    Try changing your search or filters.
                </p>

            </div>

        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/data.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/rooms.js"></script>


</body>

</html>
