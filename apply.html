<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Room | HostelHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <header class="navbar">

    <div class="logo">
        🏠 HostelHub
    </div>

    <nav class="nav-links">

        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="facilities.html">Facilities</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="applications.html">Applications</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

    <div class="nav-buttons">

        <a href="login.html" class="btn btn-outline">
            Login
        </a>

        <a href="register.html" class="btn btn-primary">
            Register
        </a>

    </div>
    
</header>
    <div class="application-container">

        <div class="application-header">

            <h1>Hostel Room Application</h1>

            <p>
                Fill in your details to apply for the selected room.
            </p>

        </div>


        <!-- SELECTED ROOM -->

        <div class="selected-room-card">

            <h2>Selected Room</h2>

            <div class="selected-room-info">

                <div>
                    <small>Room</small>
                    <strong id="applyRoomName">
                        Loading...
                    </strong>
                </div>

                <div>
                    <small>Type</small>
                    <strong id="applyRoomType">
                        Loading...
                    </strong>
                </div>

                <div>
                    <small>Rent</small>
                    <strong id="applyRoomRent">
                        Loading...
                    </strong>
                </div>

                <div>
                    <small>Floor</small>
                    <strong id="applyRoomFloor">
                        Loading...
                    </strong>
                </div>

            </div>

        </div>


        <!-- APPLICATION FORM -->

        <form id="roomApplicationForm">

            <h2>Personal Details</h2>

            <div class="form-row">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="college">
                        College / University
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="address">
                    Permanent Address
                </label>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter your permanent address"
                    required
                ></textarea>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="submit-application-btn"
                >
                    Submit Application
                </button>

            </div>

        </form>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
