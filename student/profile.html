<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | HostelHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">🏠 HostelHub</div>
        <div class="sidebar-user" id="sidebarUser"></div>
        <nav>
            <a href="dashboard.html"     class="sidebar-link">📊 Dashboard</a>
            <a href="my-room.html"       class="sidebar-link">🛏 My Room</a>
            <a href="../rooms.html"      class="sidebar-link">🏠 Browse Rooms</a>
            <a href="payments.html"      class="sidebar-link">💳 Payments</a>
            <a href="complaints.html"    class="sidebar-link">🔧 Complaints</a>
            <a href="announcements.html" class="sidebar-link">📢 Announcements</a>
            <a href="profile.html"       class="sidebar-link">👤 Profile</a>
            <button onclick="logoutUser()" class="sidebar-link sidebar-logout">🚪 Logout</button>
        </nav>
    </aside>

    <div class="dashboard-content">
        <div class="dashboard-topbar">
            <span class="topbar-title">My Profile</span>
            <span class="topbar-user" id="topbarUser"></span>
        </div>
        <main class="dashboard-main">
            <div id="messageContainer"></div>
            <div class="profile-card">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div style="margin-bottom:8px;">
                    <span class="badge badge-info">Student</span>
                    <span style="font-size:0.82rem;color:#667085;margin-left:10px;">Joined: <span id="profileJoin">—</span></span>
                </div>
                <form id="profileForm">
                    <div class="form-group-d">
                        <label>Full Name</label>
                        <input type="text" id="profileName" placeholder="Your full name">
                    </div>
                    <div class="form-group-d">
                        <label>Email</label>
                        <input type="email" id="profileEmail" placeholder="Email address" readonly style="background:#f8fafc;cursor:not-allowed;">
                    </div>
                    <div class="form-group-d">
                        <label>Phone</label>
                        <input type="tel" id="profilePhone" placeholder="Mobile number">
                    </div>
                    <div class="form-group-d">
                        <label>College / Institution</label>
                        <input type="text" id="profileCollege" placeholder="Your college name">
                    </div>
                    <div class="form-group-d">
                        <label>Home Address</label>
                        <input type="text" id="profileAddress" placeholder="Your home address">
                    </div>
                    <button type="submit" class="btn-dashboard btn-blue" style="width:100%;padding:12px;margin-top:8px;">Save Changes</button>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/student.js"></script>
</body>
</html>
