<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints | HostelHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">🏠 HostelHub</div>
        <div class="sidebar-user" id="sidebarUser"></div>
        <nav>
            <a href="dashboard.html"     class="sidebar-link">📊 Dashboard</a>
            <a href="my-room.html"       class="sidebar-link">🛏 My Room</a>
            <a href="../rooms.html"      class="sidebar-link">🏠 Browse Rooms</a>
            <a href="payments.html"      class="sidebar-link">💳 Payments</a>
            <a href="complaints.html"    class="sidebar-link">🔧 Complaints</a>
            <a href="announcements.html" class="sidebar-link">📢 Announcements</a>
            <a href="profile.html"       class="sidebar-link">👤 Profile</a>
            <button onclick="logoutUser()" class="sidebar-link sidebar-logout">🚪 Logout</button>
        </nav>
    </aside>

    <div class="dashboard-content">
        <div class="dashboard-topbar">
            <span class="topbar-title">Complaints & Maintenance</span>
            <span class="topbar-user" id="topbarUser"></span>
        </div>
        <main class="dashboard-main">
            <div id="messageContainer"></div>

            <!-- Submit Form -->
            <div class="complaint-form-card">
                <h2>🔧 Raise a New Complaint</h2>
                <form id="complaintForm">
                    <div class="form-row">
                        <div class="form-group-d">
                            <label for="complaintCategory">Category *</label>
                            <select id="complaintCategory">
                                <option value="">Select category...</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Plumbing">Plumbing</option>
                                <option value="Network">Network / Wi-Fi</option>
                                <option value="Furniture">Furniture</option>
                                <option value="Cleaning">Cleaning</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group-d">
                            <label for="complaintTitle">Issue Title *</label>
                            <input type="text" id="complaintTitle" placeholder="e.g. Fan not working">
                        </div>
                    </div>
                    <div class="form-group-d">
                        <label for="complaintDesc">Description *</label>
                        <textarea id="complaintDesc" placeholder="Describe the issue in detail..."></textarea>
                    </div>
                    <div class="form-group-d">
                        <label>Priority</label>
                        <div class="priority-group">
                            <label><input type="radio" name="priority" value="Low"> Low</label>
                            <label><input type="radio" name="priority" value="Medium"> Medium</label>
                            <label><input type="radio" name="priority" value="High" checked> High</label>
                        </div>
                    </div>
                    <button type="submit" class="btn-dashboard btn-blue" style="width:100%;padding:12px;">Submit Complaint</button>
                </form>
            </div>

            <!-- List -->
            <div class="panel">
                <div class="panel-header">
                    <h2>My Complaints</h2>
                    <span id="complaintCount" style="font-size:0.82rem;color:#667085;"></span>
                </div>
                <div class="panel-body">
                    <div id="complaintList">
                        <div class="empty-state"><span class="empty-icon">🔧</span><p>Loading...</p></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/complaints.js"></script>
</body>
</html>
