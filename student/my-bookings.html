<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Bookings | HostelHub</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>

        body {
            background: #f5f7fb;
        }

        .booking-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h1 {
            margin: 0 0 8px;
            color: #172033;
        }

        .page-heading p {
            margin: 0;
            color: #6b7280;
        }

        .booking-list {
            display: grid;
            gap: 20px;
        }

        .booking-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            border: 1px solid #e5e7eb;
        }

        .booking-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .booking-name {
            margin: 0 0 7px;
            color: #111827;
            font-size: 21px;
        }

        .booking-location {
            color: #6b7280;
            font-size: 14px;
        }

        .confirmed {
            background: #dcfce7;
            color: #15803d;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .detail-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 13px;
        }

        .detail-label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #111827;
            font-weight: 600;
            font-size: 14px;
        }

        .payment-success {
            color: #15803d;
        }

        .empty-bookings {
            background: white;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-bookings h2 {
            margin-bottom: 8px;
        }

        .empty-bookings p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .browse-btn {
            display: inline-block;
            background: #07549b;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
        }

        .booking-id {
            margin-top: 18px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 750px) {

            .booking-details {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .booking-top {
                flex-direction: column;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <div class="booking-page">


        <div class="page-heading">

            <h1>
                My Bookings
            </h1>

            <p>
                View your hostel bookings and payment status.
            </p>

        </div>


        <div
            id="bookingList"
            class="booking-list">
        </div>


    </div>


<script>


function getBookings() {

    try {

        return JSON.parse(
            localStorage.getItem("bookings")
        ) || [];

    } catch (error) {

        return [];

    }

}


function formatDate(dateString) {

    if (!dateString) {
        return "—";
    }

    const date =
        new Date(dateString);

    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );

}


function renderBookings() {

    const container =
        document.getElementById(
            "bookingList"
        );

    const bookings =
        getBookings();


    if (!bookings.length) {

        container.innerHTML = `

            <div class="empty-bookings">

                <div class="empty-icon">
                    🏠
                </div>

                <h2>
                    No bookings yet
                </h2>

                <p>
                    You haven't booked a hostel yet.
                </p>

                <a
                    href="rooms.html"
                    class="browse-btn">

                    Browse Hostels

                </a>

            </div>

        `;

        return;
    }


    container.innerHTML =
        bookings
            .slice()
            .reverse()
            .map(function(booking) {

                return `

                    <div class="booking-card">

                        <div class="booking-top">

                            <div>

                                <h2 class="booking-name">
                                    ${booking.hostelName || "Hostel"}
                                </h2>

                                <div class="booking-location">
                                    📍 ${booking.location || "Location"}
                                </div>

                            </div>

                            <span class="confirmed">
                                ✓ ${booking.bookingStatus || "Confirmed"}
                            </span>

                        </div>


                        <div class="booking-details">


                            <div class="detail-box">

                                <div class="detail-label">
                                    Room Type
                                </div>

                                <div class="detail-value">
                                    ${booking.sharing || "—"}
                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    Rent
                                </div>

                                <div class="detail-value">
                                    ₹${Number(
                                        booking.amount || 0
                                    ).toLocaleString("en-IN")}
                                    / month
                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    Payment
                                </div>

                                <div class="detail-value payment-success">
                                    ✓ ${booking.paymentStatus || "Paid"}
                                </div>

                            </div>


                            <div class="detail-box">

                                <div class="detail-label">
                                    Booking Date
                                </div>

                                <div class="detail-value">
                                    ${formatDate(booking.date)}
                                </div>

                            </div>


                        </div>


                        <div class="booking-id">

                            Booking ID:
                            <strong>
                                ${booking.id}
                            </strong>

                        </div>

                    </div>

                `;

            })
            .join("");

}


renderBookings();

</script>

</body>

</html>
